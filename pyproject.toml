[project]
name = "pyttings"
version = "2.3.0"
description = "Python settings management with namespacing and modular files. Inspired by Django."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Rui Catarino" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ruitcatarino/pyttings"
Issues = "https://github.com/ruitcatarino/pyttings/issues"
Repository = "https://github.com/ruitcatarino/pyttings"

[dependency-groups]
dev = [
  "coverage>=7.6.12",
  "coveralls>=4.0.1",
  "mypy>=1.14.1",
  "pytest>=8.3.4",
  "ruff>=0.9.4",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pyttings"]

[tool.setuptools.package-data]
pyttings = ["py.typed"]
